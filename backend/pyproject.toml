[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mage-vl-studio-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "accelerate==1.14.0",
  "bitsandbytes==0.50.0",
  "codec-video-prep==0.2.5",
  "decord==0.6.0",
  "fastapi==0.141.1",
  "huggingface-hub==1.27.0",
  "mamba-ssm==2.3.2.post1",
  "moviepy==1.0.3",
  "numpy==1.26.4",
  "opencv-python-headless==4.11.0.86",
  "pillow==11.3.0",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "safetensors==0.8.0",
  "scipy==1.17.1",
  "sse-starlette==3.4.8",
  "torch==2.9.0",
  "torchvision==0.24.0",
  "transformers==5.15.0",
  "uvicorn[standard]==0.52.2",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
